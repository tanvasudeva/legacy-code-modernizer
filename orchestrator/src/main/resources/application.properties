spring.application.name=legacy-code-modernizer

# Ollama
ollama.base-url=http://localhost:11434
ollama.model=qwen2.5-coder:1.5b
ollama.embedding-model=qwen2.5-coder:1.5b
ollama.timeout-seconds=600

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/lcm
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Neo4j
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=neo4j_password

# LLM provider priority:
#   1. Anthropic (primary)  — active when ANTHROPIC_API_KEY env var is set
#   2. Ollama   (fallback)  — active when ANTHROPIC_API_KEY is absent
# To switch: export ANTHROPIC_API_KEY=sk-ant-... before running
anthropic.model=claude-sonnet-4-6
anthropic.max-tokens=8192

# Analysis pipeline
analysis.python.executable=/opt/homebrew/bin/python3.11
analysis.scripts.dir=../scripts
analysis.louvain.use-llm=false

# Qdrant
qdrant.url=http://localhost:6333

# Shared library detection (DD2)
sharedLibrary.minServiceCount=2

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,loggers,beans,env

# Error details (debug only — remove before prod)
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always
