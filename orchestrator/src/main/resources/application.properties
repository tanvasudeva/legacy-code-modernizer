spring.application.name=legacy-code-modernizer

# Ollama
ollama.base-url=http://localhost:11434
ollama.model=codellama:13b
ollama.embedding-model=codellama:13b
ollama.timeout-seconds=120

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/lcm
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Neo4j
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=neo4j_password

# Anthropic (ANTHROPIC_API_KEY env var activates AnthropicConfig; falls back to Ollama if absent)
anthropic.model=claude-sonnet-4-6
anthropic.max-tokens=8192

# Analysis pipeline
analysis.python.executable=/opt/homebrew/bin/python3.11
analysis.scripts.dir=../scripts
analysis.louvain.use-llm=false

# Qdrant
qdrant.url=http://localhost:6333

# Shared library detection (DD2)
sharedLibrary.minServiceCount=2

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
