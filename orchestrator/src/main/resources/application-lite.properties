# Lite profile — cheap development runs
# Activate with: --spring.profiles.active=lite
#
# Estimated cost vs full Sonnet run: ~3-5%
# Use this for: testing fixes, verifying pipeline, iterating on prompts

# Smaller/faster model (already the default, but explicit here)
anthropic.model=claude-haiku-4-5-20251001
anthropic.max-tokens=4096

# Fewer RAG snippets per service (2 vs 5)
benchmark.rag-top-k=2

# Skip DocGenAgent — contributes to zero eval metrics
benchmark.skip-docs=true

# Only one repair attempt instead of three
repair.max-attempts=1

# Fewer method signatures in prompt (10 vs 30)
service-gen.max-method-sigs=10
