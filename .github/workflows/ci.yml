name: CI

on:
  push:
    branches: [main, feature]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile all modules
        run: mvn compile -q

      - name: Run unit tests (no infrastructure required)
        run: |
          mvn test -pl evaluator,agents -am \
            -Dtest="BaselineCodeExtractorTest,CohesionMetricTest,MetricTest,\
          ArchitectAgentTest,DocGenAgentTest,RefactorerAgentTest,\
          ServiceGeneratorAgentTest,TestWriterAgentTest" \
            --no-transfer-progress

      - name: Package (skip tests — integration tests need Neo4j/PG/Qdrant)
        run: mvn package -DskipTests -q

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
